services:
  db:
    image: pgvector/pgvector:pg17
    container_name: cv-agent-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: cv
      POSTGRES_PASSWORD: cv
      POSTGRES_DB: cv_agent
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cv -d cv_agent"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
