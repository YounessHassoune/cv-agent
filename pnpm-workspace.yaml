overrides:
  # Pinned past GHSA-rgj7-g3m4-5g8c and GHSA-c22k-c4r6-9wqh: sharp before
  # 0.35.4 bundles libheif and libvips builds with known CVEs, and Next pulls it
  # in for image optimization. Same minor, so it stays API-compatible with the
  # version Next asks for.
  sharp: ">=0.35.4"
minimumReleaseAgeExclude:
  - "@ai-sdk/*"
  - "@rolldown/*"
  - "@vercel/*"
  - "@workflow/*"
  - ai
  - experimental-ai-sdk-code-mode
  - eve
  - nitro
  - rolldown
  - workflow
allowBuilds:
  # Prisma downloads/builds its query engine in a postinstall script — without
  # this, `prisma generate` and every db command fail.
  '@mongodb-js/zstd': false
  '@prisma/engines': true
  node-liblzma: false
  prisma: true
  sharp: false
# Compatibility for eve releases with an incomplete runtime manifest.
packageExtensions:
  "eve@>=0.6.0-beta.13 <=0.7.0":
    dependencies:
      oxc-parser: 0.134.0
