<style type="text/tailwindcss">
@import "tailwindcss";

/*
 * The palette lives in plain custom properties, not in @theme, because the
 * theme has three states: an explicit choice stamps data-theme, and the default
 * "system" setting stamps nothing at all. @theme then points at these, so every
 * Tailwind colour utility resolves through whichever set is currently active.
 */
:root{
  --p-bg:#EEF1F3; --p-surface:#FFFFFF;
  --p-ink:#10161D; --p-muted:#5C6874; --p-rule:#CBD4DC;
  --p-accent:#0B6E75; --p-accent-soft:rgba(11,110,117,.09);
  --p-pass:#24693F; --p-fail:#A8301F; --p-warn:#8A5A14;
  --p-pass-soft:rgba(36,105,63,.10); --p-fail-soft:rgba(168,48,31,.09);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --p-bg:#0D1116; --p-surface:#151B22;
    --p-ink:#E6EBF0; --p-muted:#95A3B1; --p-rule:#28323C;
    --p-accent:#3FC0C6; --p-accent-soft:rgba(63,192,198,.12);
    --p-pass:#5FCB8B; --p-fail:#F08575; --p-warn:#E0B15C;
    --p-pass-soft:rgba(95,203,139,.12); --p-fail-soft:rgba(240,133,117,.12);
  }
}
:root[data-theme="dark"]{
  --p-bg:#0D1116; --p-surface:#151B22;
  --p-ink:#E6EBF0; --p-muted:#95A3B1; --p-rule:#28323C;
  --p-accent:#3FC0C6; --p-accent-soft:rgba(63,192,198,.12);
  --p-pass:#5FCB8B; --p-fail:#F08575; --p-warn:#E0B15C;
  --p-pass-soft:rgba(95,203,139,.12); --p-fail-soft:rgba(240,133,117,.12);
}

@theme {
  --color-paper:var(--p-bg);
  --color-surface:var(--p-surface);
  --color-ink:var(--p-ink);
  --color-muted:var(--p-muted);
  --color-rule:var(--p-rule);
  --color-accent:var(--p-accent);
  --color-accent-soft:var(--p-accent-soft);
  --color-pass:var(--p-pass);
  --color-fail:var(--p-fail);
  --color-warn:var(--p-warn);
  --color-pass-soft:var(--p-pass-soft);
  --color-fail-soft:var(--p-fail-soft);

  --font-sans:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --font-serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --font-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;

  /* Fluid type, named once. `text-h2` beats an arbitrary clamp() repeated in
     the markup — and it is the only place a size is tuned. */
  --text-h1:clamp(2.4rem,7.2vw,5.2rem);
  --text-h2:clamp(1.75rem,4.4vw,3.35rem);
  --text-h3:clamp(1.12rem,2.25vw,1.46rem);
  --text-lede:clamp(1.2rem,2.25vw,1.68rem);
  --text-sub:clamp(1rem,1.9vw,1.35rem);
  --text-body:clamp(1.08rem,1.75vw,1.42rem);
  --text-li:clamp(1.06rem,1.7vw,1.38rem);
  --text-note:clamp(.95rem,1.5vw,1.16rem);
  --text-row:clamp(.98rem,1.6vw,1.26rem);
  --text-cell:clamp(.92rem,1.55vw,1.22rem);
  --text-pre:clamp(.72rem,1.32vw,1.02rem);
  --text-formula:clamp(.92rem,2.35vw,1.62rem);
  --text-eyebrow:clamp(.7rem,1.2vw,.84rem);
  --text-cap:clamp(.66rem,1.1vw,.8rem);
  --text-agenda:clamp(1.15rem,2.45vw,1.78rem);

  /* Page rhythm, also named: the gutter is the one a block measures its way
     back out of, and the paddings are what the slide body subtracts. */
  --spacing-gutter:clamp(1rem,5vw,4.5rem);
  --spacing-padtop:clamp(1.4rem,3.4vh,3rem);
  --spacing-padbot:clamp(3.6rem,7vh,5rem);
  --spacing-band:clamp(.7rem,1.9vh,1.5rem);
  --spacing-tight:clamp(.3rem,.9vh,.6rem);
  --spacing-rule:clamp(.5rem,1.6vh,1.1rem);
  --spacing-colgap:clamp(1.6rem,4.5vw,4rem);

  --animate-rise:rise .32s ease both;
}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* The host paints its own ground behind the page, so body must claim one from
   a token — a transparent body borrows the other theme's background. */
body{
  background:var(--p-bg); color:var(--p-ink);
  font-family:var(--font-serif); font-size:16px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}

/*
 * The only rules left that are not utilities, and each for a reason a class
 * cannot cover: the host owns the <body> tag, an @keyframes has nowhere else to
 * live, and `invert-dark` keys off the theme state rather than a breakpoint.
 */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) img.invert-dark{filter:invert(1)}
}
:root[data-theme="dark"] img.invert-dark{filter:invert(1)}

 * the deck never means editing this file. Strings there accept **bold**,
 * *italic*, `code` and raw HTML — the file is authored, not user input, so it
 * is rendered as written.

 * Styling is Tailwind. Repeated class strings are named in `C` rather than
 * inlined at every call site, so a change to "what a lede looks like" is one
 * edit and not fourteen.

    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');

      .replace(/\*\*([\s\S]+?)\*\*/g, '<strong class="font-semibold">$1</strong>')

ss="fill-current font-sans text-[11px] fill-fail" x="158" y="160" text-anchor="middle">no memory · no tools · nothing happens</text><text class="fill-current font-mono text-[10.5px] tracking-[.08em] uppercase fill-muted" x="340" y="20" text-anchor="start">An agent = model + harness + tools + memory</text><rect class="fill-none stroke-rule stroke-[1.5]" x="340" y="32" width="470" height="150" rx="3"/><rect class="fill-surface stroke-current stroke-[1.5]" x="351" y="60" width="100" height="52" rx="3"/><text class="fill-current font-sans text-[13px] font-semibold" x="401" y="90" text-anchor="middle">Model</text><text class="fill-current font-sans text-[11px] fill-muted" x="401" y="130" text-anchor="middle">decides what</text><text class="fill-current font-sans text-[11px] fill-muted" x="401" y="144" text-anchor="middle">to do next</text><rect class="fill-accent-soft stroke-accent stroke-[1.5]" x="467" y="60" width="100" height="52" rx="3"/><text class="fill-current font-sans text-[13px] font-semibold" x="517" y="90" text-anchor="middle">Harness</text><text class="fill-current font-sans text-[11px] fill-muted" x="517" y="130" text-anchor="middle">validates every</text><text class="fill-current font-sans text-[11px] fill-muted" x="517" y="144" text-anchor="middle">call first</text><rect class="fill-surface stroke-current stroke-[1.5]" x="583" y="60" width="100" height="52" rx="3"/><text class="fill-current font-sans text-[13px] font-semibold" x="633" y="90" text-anchor="middle">Tools</text><text class="fill-current font-sans text-[11px] fill-muted" x="633" y="130" text-anchor="middle">real code that</text><text class="fill-current font-sans text-[11px] fill-muted" x="633" y="144" text-anchor="middle">writes and renders</text><rect class="fill-surface stroke-current stroke-[1.5]" x="699" y="60" width="100" height="52" rx="3"/><text class="fill-current font-sans text-[13px] font-semibold" x="749" y="90" text-anchor="middle">Memory</text><text class="fill-current font-sans     "prompt-vs-pipeline": '<figure class="flex flex-col items-center gap-[clamp(.4rem,1.2vh,.8rem)] w-full"><svg class="w-full max-w-[min(1000px,100%)] h-auto block text-ink" role="img" viewBox="0 0 900 268" aria-label="A single chatbot prompt returns text, whereas a tool pipeline returns a checked document and a measured score"><defs><marker id="a-9" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto"><path d="M0 0 L10 4 L0 8 z" class="fill-current"/></marker><marker id="ax-9" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto"><path d="M0 0 L10 4 L0 8 z" class="fill-accent"/></marker><marker id="ar-9" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto"><path d="M0 0 L10 4 L0 8 z" class="fill-fail"/></marker></defs><text class="fill-current font-mono text-[10.5px] tracking-[.08em] uppercase fill-muted" x="8" y="20" text-anchor="start">One prompt</text><rect class="fill-none stroke-rule stroke-[1.5]" x="8" y="32" width="250" height="204" rx="3"/><rect class="fill-surface stroke-current stroke-[1.5]" x="73" y="56" width="120" height="40" rx="3"/><text class="fill-current font-sans text-[13px] font-semibold" x="133" y="81" text-anchor="middle">CV + offer</text><rect class="fill-surface stroke-current stroke-[1.5]" x="73" y="118" width="120" height="40" rx="3"/><text class="fill-current font-sans text-[13px] font-semibold" x="133" y="143" text-anchor="middle">Chatbot</text><rect class="fill-surface stroke-current stroke-[1.5]" x="73" y="180" width="120" height="40" rx="3"/><text class="fill-current font-sans text-[13px] font-semibold" x="133" y="205" text-anchor="middle">Text</text><path class="fill-none stroke-current stroke-[1.5]" d="M133 96 V112" marker-end="url(#a-9)"/><path class="fill-none stroke-current stroke-[1.5]" d="M133 158 V174" marker-end="url(#a-9)"/><text class="fill-current font-sans text-[11px] fill-fail" x="133" y="228" text-anchor="middle">fabricates · no rent stroke-[1.5]" d="M726 102 H738" marker-end="url(#a-9)"/><text class="fill-current font-sans text-[11px] fill-accent" x="663" y="148" text-anchor="middle">single-column ATS PDF</text><path class="fill-none stroke-current stroke-[1.5] stroke-accent [stroke-dasharray:5_4]" d="M807 126 V186 H519 V132" marker-end="url(#ax-9)"/><text class="fill-current font-sans text-[11px] fill-accent" x="663" y="202" text-anchor="middle">revise once, then the user drives</text></svg><figcaption class="font-mono text-cap tracking-[.06em] text-muted text-center max-w-[72ch]">Same model underneath. The difference is what the code around it refuses to let through.</figcaption></figure>',
    "architecture-flow": '<figure class="flex flex-col items-center gap-[clamp(.4rem,1.2vh,.8rem)] w-full"><svg class="w-full max-w-[min(1000px,100%)] h-auto block text-ink" role="img" viewBox="0 0 820 306" aria-label="Layered architecture: browser, Next.js, the eve agent runtime beside the deterministic layer, and one PostgreSQL database"><defs><marker id="a-10" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto"><path d="M0 0 L10 4 L0 8 z" class="fill-current"/></marker><marker id="ax-10" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto"><path d="M0 0 L10 4 L0 8 z" class="fill-accent"/></marker><marker id="ar-10" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto"><path d="M0 0 L10 4 L0 8 z" class="fill-fail"/></marker></defs><rect class="fill-surface stroke-current stroke-[1.5]" x="60" y="8" width="700" height="40" rx="3"/><text class="fill-current font-sans text-[13px] font-semibold" x="410" y="33" text-anchor="middle">Browser: React 19 · Tailwind CSS 4</text><path class="fill-none stroke-current stroke-[1.5]" d="M410 48 V66" marker-end="url(#a-10)"/><rect class="fill-surface stroke-current stroke-[1.5]" x="60" y="66" width="700" height="52" rx="3"/><text class="fill-current font-sans text-[13px] font-semibold" x="410" y="88" text-anchor="middle">Next.js 16, App Router</text><text class="fill-current font-sans text-[11px] fill-muted" x="410" y="105" text-anchor="middle">marketing · dashboard · REST API · /eve/v1/* behind a signed session cookie</text><path class="fill-none stroke-current stroke-[1.5]" d="M225 118 V142" marker-end="url(#a-10)"/><path class="fill-none stroke-current stroke-[1.5]" d="M595 118 V142" marker-end="url(#a-10)"/><rect class="fill-accent-soft stroke-accent stroke-[1.5]" x="60" y="142" width="330" height="74" rx="3"/><text class="fill-current font-sans text-[13px] font-semibold" x="225" y="165" text-anchor="middle">Agent runtime: eve</text><text class="fill-current font-sans text-[11px] fill-muted" x="225" y="182" text-anchor="middle">orchestrator · 5 typed tools</text><text class="fill-current font-sans text-[11px] fill-muted" x="225" y="196" text-anchor="middle">hooks · durable session state</text><rect class="fill-surface stroke-current stroke-[1.5]" x="430" y="142" width="330" height="74" rx="3"/><text class="fill-current font-sans text-[13px] font-semibold" x="595" y="165" text-anchor="middle">Deterministic layer: TypeScript</text><text class="fill-current font-sans text-[11px] fill-muted" x="595" y="182" text-anchor="middle">truth guard · hybrid ATS scorer</text><text class="fill-current font-sans text-[11px] fill-muted" x="595" y="196" text-anchor="middle">PDF render · entitlements · metering</text><path class="fill-none stroke-current stroke-[1.5]" d="M390 172 H424" marker-end="url(#a-10)"/><text class="fill-current font-sans text-[11px] fill-muted" x="407" y="164" text-anchor="middle">calls</text><path class="fill-none stroke-current stroke-[1.5]" d="M225 216 V244 H386" marker-end="url(#a-10)"/><path class="fill-none stroke-current stroke-[1.5]" d="M595 216 V244 H434" marker-end="url(#a-10)"/><rect class="fill-surface stroke-current stroke-[1.5]" x="250" y="244" width="320" height="42" rx="3"/><text class="fill-current font-sans text-[13px] font-semibold" x="410" y="262" text-anchor="middle">PostgreSQL 17 · Prisma 7</text><text class="fill-current font-sans text-[11px] fill-muted" x="410" y="278" text-anchor="middle">13 entities · every row scoped to one user</text><text class="fill-current font-sans text-[11px] fill-muted" x="410" y="300" text-anchor="middle">External: AI Gateway · Stripe · Resend · Cloudinary · Google OAuth</text></svg><figcaption class="font-mono text-cap tracking-[.06em] text-muted text-center max-w-[72ch]">The model never reaches the database. Every write goes through a tool the harness validated first.</figcaption></figure>',
    "ats-funnel": '<figure class="flex flex-col items-center gap-[clamp(.4rem,1.2vh,.8rem)] w-full"><svg class="w-full max-w-[min(1000px,100%)] h-auto block text-ink" role="img" viewBox="0 0 760 172" aria-label="An applicant tracking system filters CVs in three stages before any human reads one"><defs><marker id="a-1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto"><path d="M0 0 L10 4 L0 8 z" class="fill-current"/></marker><marker id="ax-1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto"><path d="M0 0 L10 4 L0 8 z" class="fill-accent"/></marker><marker id="ar-1" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto"><path d="M0 0 L10 4 L0 8 z" class="fill-fail"/></marker></defs><text class="fill-current font-mono text-[10.5px] tracking-[.08em] uppercase fill-muted" x="8" y="26">Applications</text><rect class="fill-none stroke-rule stroke-[1.5]" x="8" y="36" width="86" height="52" rx="3"/><text class="fill-current font-sans text-[13px] font-semibold" x="51" y="60" text-anchor="middle">200</text><text class="fill-current font-sans text-[13px] text-[11px] fill-muted" x="51" y="76" text-anchor="middle">received</text><rect class="fill-surface stroke-current stroke-[1.5]" x="150" y="30" width="140" height="64" rx="3"/><text class="fill-current font-sans text-[13px] font-semibold" x="220" y="56" text-anchor="middle">Parsing</text><text class="fill-current font-sans text-[13px] text-[11px] fill-muted" x="220" y="74" text-anchor="middle">file → fields</text><path class="fill-none stroke-current stroke-[1.5]" d="M290 62 H322" marker-end="url(#a-1)"/><rect class="fill-surface stroke-current stroke-[1.5]" x="330" y="30" width="140" height="64" rx="3"/><text class="fill-current font-sans text-[13px] font-semibold" x="400" y="56" text-anchor="middle">Keyword filter</text><text class="fill-current font-sans text-[13px] text-[11px] fill-muted" x="400" y="74" text-anchor="middle">mu     "agent-loop": '<figure class="flex flex-col items-center gap-[clamp(.4rem,1.2vh,.8rem)] w-full"><svg class="w-full max-w-[min(1000px,100%)] h-auto block text-ink" role="img" viewBox="0 0 760 222" aria-label="A loop of three steps: the model plans, the harness runs the step for real, the model checks the result, and the cycle repeats until the job is done"><defs><marker id="a-2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto"><path d="M0 0 L10 4 L0 8 z" class="fill-current"/></marker><marker id="ax-2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto"><path d="M0 0 L10 4 L0 8 z" class="fill-accent"/></marker><marker id="ar-2" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto"><path d="M0 0 L10 4 L0 8 z" class="fill-fail"/></marker></defs><text class="fill-current font-mono text-[10px] tracking-[.12em] uppercase fill-muted" x="115" y="26" text-anchor="middle">The model</text><rect class="fill-surface stroke-current stroke-[1.5]" x="20" y="40" width="190" height="84" rx="3"/><text class="fill-current font-sans text-[14px] font-semibold" x="115" y="78" text-anchor="middle">1 · Plan</text><text class="fill-current font-sans text-[11px] fill-muted" x="115" y="100" text-anchor="middle">picks the next step</text><text class="fill-current font-mono text-[10px] tracking-[.12em] uppercase fill-accent" x="380" y="26" text-anchor="middle">The harness</text><rect class="fill-accent-soft stroke-accent stroke-[1.5]" x="285" y="40" width="190" height="84" rx="3"/><text class="fill-current font-sans text-[14px] font-semibold" x="380" y="78" text-anchor="middle">2 · Run</text><text class="fill-current font-sans text-[11px] fill-muted" x="380" y="100" text-anchor="middle">does it for real</text><text class="fill-current font-mono text-[10px] tracking-[.12em] uppercase fill-muted" x="645" y="26" text-anchor="middle">The model</text><rect class="fill-surface stroke-current stroke-[1.5]" x="550" y="40" width="190" height="84" rx="3"/><text class="fill-current font-sans text-[14px] font-semibold" x="645" y="78" text-anchor="middle">3 · Check</text><text class="fill-current font-sans text-[11px] fill-muted" x="645" y="100" text-anchor="middle">reads what happened</text><path class="fill-none stroke-current stroke-[1.5]" d="M210 82 H279" marker-end="url(#a-2)"/><path class="fill-none stroke-current stroke-[1.5]" d="M475 82 H544" marker-end="url(#a-2)"/><path class="fill-none stroke-current stroke-[1.5] stroke-accent [stroke-dasharray:5_4]" d="M645 124 V170 H115 V130" marker-end="url(#ax-2)"/><text class="fill-current font-sans text-[11px] fill-accent" x="380" y="192" text-anchor="middle">4 · Repeat, until the job is done. Then it answers you</text></svg></figure>',
    "tool-call-path": '<figure class="flex flex-col items-center gap-[clamp(.4rem,1.2vh,.8rem)] w-full"><svg class="w-full max-w-[min(1000px,100%)] h-auto block text-ink" role="img" viewBox="0 0 760 218" aria-label="Before, the whole CV travelled through the orchestrator twice; after, it goes straight from the tool to the database"><defs><marker id="a-3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto"><path d="M0 0 L10 4 L0 8 z" class="fill-current"/></marker><marker id="ax-3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto"><path d="M0 0 L10 4 L0 8 z" class="fill-accent"/></marker><marker id="ar-3" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto"><path d="M0 0 L10 4 L0 8 z" class="fill-fail"/></marker></defs><text class="fill-current font-mono text-[10.5px] tracking-[.08em] uppercase fill-fail" x="10" y="18">Before: sub-agents</text><rect class="fill-surface stroke-current stroke-[1.5]" x="10" y="34" width="130" height="46" rx="3"/><text class="fill-current font-sans text-[13px] font-semibold" x="75" y="62" text-anchor="middle">Orchestrator</text><rect class="fill-surface stroke-current stroke-[1.5]" x="10" y="140" width="130" height="46" rx="3"/><text class="fill-current font-sans text-[13px] font-semibold" x="75" y="168" text-anchor="middle">Sub-agent</text><rect class="fill-none stroke-rule stroke-[1.5]" x="210" y="140" width="110" height="46" rx="3"/><text class="fill-current font-sans text-[13px] fill-muted" x="265" y="168" text-anchor="middle">Database</text><path class="fill-none stroke-current stroke-[1.5] stroke-fail stroke-[5] [stroke-linecap:round]" d="M60 136 V86" marker-end="url(#ar-3)"/><path class="fill-none stroke-current stroke-[1.5] stroke-fail stroke-[5] [stroke-linecap:round]" d="M108 86 V136" marker-end="url(#ar-3)"/><text class="fill-current font-sans text-[13px] text-[11px] fill-fail" x="124" y="106">full CV,</text><text class="fill-current font-sans text-[13px] text-[11px] fill-fail" x="124" y="120">both ways</text><text class="fill-current font-sans text-[13px] text-[11px] fill-fail" x="10" y="208">retyped by the orchestrator · 40–60 s per step</text><path class="fill-none stroke-rule stroke-[1.5]" d="M360 10 V215"/><text class="fill-current font-mono text-[10.5px] tracking-[.08em] uppercase fill-pass" x="400" y="18">After: the call lives in the tool</text><rect class="fill-surface stroke-current stroke-[1.5]" x="400" y="34" width="130" height="46" rx="3"/><text class="fill-current font-sans text-[13px] font-semibold" x="465" y="62" text-anchor="middle">Orchestrator</text><rect class="fill-surface stroke-current stroke-[1.5]" x="400" y="140" width="130" height="46" rx="3"/><text class="fill-current font-sans text-[13px] font-semibold" x="465" y="168" text-anchor="middle">Tool</text><rect class="fill-accent-soft stroke-accent stroke-[1.5]" x="600" y="140" width="130" height="46" rx="3"/><text class="fill-current font-sans text-[13px] font-semibold" x="665" y="168" text-anchor="middle">Database</text><path class="fill-none stroke-current stroke-[1.5]" d="M440 86 V134" marker-end="url(#a-3)"/><text class="fill-current font-sans text-[13px] text-[11px] fill-muted" x="356" y="114">applicationId</text><path class="fill-none stroke-current stroke-[1.5]" d="M496 134 V86" marker-end="url(#a-3)"/><text class="fill-current font-sans text-[13px] text-[11px] fill-muted" x="504" y="106">receipt</text><text class="fill-current font-sans text-[13px] text-[11px] fill-muted" x="504" y="120">“6 terms”</text><path class="fill-none stroke-current stroke-[1.5] stroke-pass stroke-[5] [stroke-linecap:round]" d="M530 163 H594" marker-end="url(#a-3)"/><text class="fill-current font-sans text-[13px] text-[11px] fill-pass" x="562" y="204" text-anchor="middle">full CV</text><text class="fill-current font-sans text-[13px] text-[11px] fill-pass" x="400" y="208">the document never enters the model’s context</text></svg><figcaption class="font-mono text-cap tracking-[.06em] text-muted text-center max-w-[72ch]">The only thing that moved is where the thick arrow points. That is the difference between 40–60 s per step and a one-line receipt.</figcaption></figure>',
    "guard-sets": '<figure class="flex flex-col items-center gap-[clamp(.4rem,1.2vh,.8rem)] w-full"><svg class="w-full max-w-[min(1000px,100%)] h-auto block text-ink" role="img" viewBox="0 0 640 320" aria-label="Three overlapping circles: what is in your profile, what this offer asks for, and what you asked to add. Only words inside them may appear on the CV"><defs><marker id="ar-4" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto"><path d="M0 0 L10 4 L0 8 z" class="fill-fail"/></marker></defs><circle class="fill-none stroke-rule stroke-[1.5]" cx="230" cy="130" r="105"/><circle class="fill-none stroke-rule stroke-[1.5]" cx="360" cy="130" r="105"/><circle class="fill-accent-soft stroke-accent stroke-[1.5]" cx="295" cy="212" r="62"/><text class="fill-current font-mono text-[10px] tracking-[.12em] uppercase" x="163" y="66" text-anchor="middle">Your profile</text><text class="fill-current font-mono text-[10px] tracking-[.12em] uppercase" x="428" y="66" text-anchor="middle">This offer</text><text class="fill-current font-mono text-[10px] tracking-[.12em] uppercase fill-accent" x="295" y="262" text-anchor="middle">You asked for it</text><text class="fill-current font-sans text-[13px] font-semibold" x="295" y="126" text-anchor="middle">ALLOWED</text><text class="fill-current font-sans text-[11px] fill-muted" x="295" y="144" text-anchor="middle">may appear on the CV</text><path class="fill-none stroke-fail stroke-[1.5] [stroke-dasharray:5_4]" d="M520 120 H472" marker-end="url(#ar-4)"/><text class="fill-current font-sans text-[11px] fill-fail" x="530" y="108" text-anchor="start">Anything else</text><text class="fill-current font-sans text-[11px] fill-fail" x="530" y="124" text-anchor="start">is invented,</text><text class="fill-current font-sans text-[11px] fill-fail" x="530" y="140" text-anchor="start">the PDF is</text><text class="fill-current font-sans text-[11px] fill-fail" x="530" y="156" text-anchor="start">refused</text><text class="fill-current font-sans text-[11px] fill-muted" x="320" y="306" text-anchor="middle">This applies to skills only. Employers, titles and dates come from the profile, always.</text></svg></figure>',
    "score-weights": '<figure class="flex flex-col items-center gap-[clamp(.4rem,1.2vh,.8rem)] w-full"><svg class="w-full max-w-[min(1000px,100%)] h-auto block text-ink" role="img" viewBox="0 0 700 246" aria-label="The formula: four weighted measures give a base score, which is multiplied by the proportion of required skills present"><defs><marker id="a-5" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto"><path d="M0 0 L10 4 L0 8 z" class="fill-current"/></marker></defs><text class="fill-current font-mono text-[12px]" x="20" y="20" text-anchor="start">base  = 0.35·vocabulary + 0.35·meaning + 0.15·structure + 0.15·fit</text><text class="fill-current font-mono text-[12px] font-bold" x="20" y="40" text-anchor="start">total = round( base × required-skill coverage )</text><path class="fill-none stroke-rule stroke-[1.5]" d="M20 54 H680"/><text class="fill-current font-mono text-[10px] tracking-[.12em] uppercase fill-muted" x="20" y="74" text-anchor="start">The four measures</text><rect class="fill-accent" x="20" y="84" width="221" height="44" rx="2" opacity=".9"/><text class="fill-current font-sans text-[12px] font-semibold fill-paper" x="130" y="104" text-anchor="middle">vocabulary</text><text class="fill-current font-sans text-[11px] fill-paper" x="130" y="120" text-anchor="middle">35 %</text><rect class="fill-accent" x="244" y="84" width="221" height="44" rx="2" opacity=".9"/><text class="fill-current font-sans text-[12px] font-semibold fill-paper" x="354" y="104" text-anchor="middle">meaning</text><text class="fill-current font-sans text-[11px] fill-paper" x="354" y="120" text-anchor="middle">35 %</text><rect class="fill-muted" x="468" y="84" width="93" height="44" rx="2" opacity=".35"/><text class="fill-current font-sans text-[12px] font-semibold fill-paper" x="514" y="104" text-anchor="middle">structure</text><text class="fill-current font-sans text-[11px] fill-paper" x="514" y="120" text-anchor="middle">15 %</text><rect class="fill-muted" x="564" y="84" width="93" height="44" rx="2" opacity=".35"/><text class="fill-current font-sans text-[12px] font-semibold fill-paper" x="610" y="104" text-anchor="middle">fit</text><text class="fill-current font-sans text-[11px] fill-paper" x="610" y="120" text-anchor="middle">15 %</text><text class="fill-current font-mono text-[10px] tracking-[.12em] uppercase fill-muted" x="20" y="156" text-anchor="start">Required-skill coverage</text><rect class="fill-none stroke-rule stroke-[1.5]" x="20" y="166" width="380" height="40" rx="2"/><rect class="fill-pass" x="20" y="166" width="253" height="40" rx="2" opacity=".5"/><text class="fill-current font-sans text-[12px] font-semibold" x="146" y="191" text-anchor="middle">4 of the 6 present</text><text class="fill-current font-sans text-[11px] fill-fail" x="336" y="191" text-anchor="middle">2 missing</text><path class="fill-none stroke-current stroke-[1.5]" d="M408 186 H446" marker-end="url(#a-5)"/><text class="fill-current font-mono text-[12px] font-bold" x="458" y="182" text-anchor="start">total = base × 0.67</text><text class="fill-current font-sans text-[11px] fill-muted" x="458" y="200" text-anchor="start">a third of the score, gone</text><text class="fill-current font-sans text-[11px] fill-muted" x="20" y="234" text-anchor="start">A missing requirement cannot be offset by strong writing: the coverage multiplies, it does not average.</text></svg></figure>',
    "screen-axis": '<figure class="flex flex-col items-center gap-[clamp(.4rem,1.2vh,.8rem)] w-full"><svg class="w-full max-w-[min(1000px,100%)] h-auto block text-ink" role="img" viewBox="0 0 720 336" aria-label="Top: the word you asked for and the job ad each become a list of numbers, and how close the two lists are gives a score. Bottom: that score is compared with the threshold of 0.20 to accept or refuse the word"><defs><marker id="a-6" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto"><path d="M0 0 L10 4 L0 8 z" class="fill-current"/></marker><marker id="ax-6" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7" markerHeight="6" orient="auto"><path d="M0 0 L10 4 L0 8 z" class="fill-accent"/></marker></defs><text class="fill-current font-mono text-[10px] tracking-[.12em] uppercase fill-muted" x="8" y="18" text-anchor="start">1 · Where the number comes from</text><rect class="fill-surface stroke-current stroke-[1.5]" x="8" y="28" width="136" height="44" rx="3"/><text class="fill-current font-sans text-[13px] font-semibold" x="76" y="50" text-anchor="middle">Databricks</text><text class="fill-current font-sans text-[11px] fill-muted" x="76" y="66" text-anchor="middle">the word you asked for</text><rect class="fill-surface stroke-current stroke-[1.5]" x="8" y="86" width="136" height="44" rx="3"/><text class="fill-current font-sans text-[13px] font-semibold" x="76" y="108" text-anchor="middle">The job ad</text><text class="fill-current font-sans text-[11px] fill-muted" x="76" y="124" text-anchor="middle">its whole text</text><rect class="fill-surface stroke-current stroke-[1.5]" x="190" y="50" width="150" height="52" rx="3"/><text class="fill-current font-sans text-[13px] font-semibold" x="265" y="76" text-anchor="middle">Each becomes</text><text class="fill-current font-sans text-[11px] fill-muted" x="265" y="92" text-anchor="middle">a list of numbers</text><rect class="fill-surface stroke-current stroke-[1.5]" x="390" y="50" width="160" height="52" rx="3"/><text class="fill-current font-sans text-[13px] font-semibold" x="470" y="76" text-anchor="middle">Measure how close</text><text class="fill-current font-sans text-[11px] fill-muted" x="470" y="92" text-anchor="middle">the two lists are</text><rect class="fill-accent-soft stroke-accent stroke-[1.5]" x="600" y="56" width="90" height="40" rx="3"/><text class="fill-current font-sans text-[13px] font-semibold fill-accent" x="645" y="81" text-anchor="middle">0.49</text><path class="fill-none stroke-current stroke-[1.5]" d="M144 50 H167 V76 H184" marker-end="url(#a-6)"/><path class="fill-none stroke-current stroke-[1.5]" d="M144 108 H167 V76 H184" marker-end="url(#a-6)"/><path class="fill-none stroke-current stroke-[1.5]" d="M340 76 H384" marker-end="url(#a-6)"/><path class="fill-none stroke-current stroke-[1.5]" d="M550 76 H594" marker-end="url(#a-6)"/><text class="fill-current font-sans text-[11px] fill-muted" x="470" y="120" text-anchor="middle">0 = nothing in common · 1 = the same thing</text><path class="fill-none stroke-rule stroke-[1.5]" d="M8 142 H712"/><text class="fill-current font-mono text-[10px] tracking-[.12em] uppercase fill-muted" x="8" y="162" text-anchor="start">2 · How that number decides</text><path class="fill-none stroke-fail stroke-[3]" d="M60 258 H210"/><path class="fill-none stroke-pass stroke-[3]" d="M210 258 H660"/><path class="fill-none stroke-accent stroke-[1.5]" d="M210 176 V274"/><text class="fill-current font-sans text-[13px] font-semibold fill-accent" x="210" y="170" text-anchor="middle">0.20</text><text class="fill-current font-sans text-[12px] fill-fail" x="90" y="212" text-anchor="middle">Horse riding</text><path class="fill-none stroke-fail stroke-[1.5]" d="M90 218 V252"/><circle class="fill-fail" cx="90" cy="258" r="4"/><text class="fill-current font-sans text-[12px] fill-fail" x="165" y="194" text-anchor="middle">Carpentry</text><path class="fill-none stroke-fail stroke-[1.5]" d="M165 200 V252"/><circle class="fill-fail" cx="165" cy="258" r="4"/><text class="fill-current font-sans text-[12px] fill-fail" x="195" y="212" text-anchor="middle">Plumbing</text><path class="fill-none stroke-fail stroke-[1.5]" d="M195 218 V252"/><circle class="fill-fail" cx="195" cy="258" r="4"/><text class="fill-current font-sans text-[12px] fill-pass" x="225" y="194" text-anchor="middle">dbt</text><path class="fill-none stroke-pass stroke-[1.5]" d="M225 200 V252"/><circle class="fill-pass" cx="225" cy="258" r="4"/><text class="fill-current font-sans text-[12px] fill-pass" x="345" y="212" text-anchor="middle">Airflow</text><path class="fill-none stroke-pass stroke-[1.5]" d="M345 218 V252"/><circle class="fill-pass" cx="345" cy="258" r="4"/><text class="fill-current font-sans text-[12px] fill-pass" x="420" y="194" text-anchor="middle">Excel</text><path class="fill-none stroke-pass stroke-[1.5]" d="M420 200 V252"/><circle class="fill-pass" cx="420" cy="258" r="4"/><text class="fill-current font-sans text-[12px] fill-pass" x="570" y="212" text-anchor="middle">Data governance</text><path class="fill-none stroke-pass stroke-[1.5]" d="M570 218 V252"/><circle class="fill-pass" cx="570" cy="258" r="4"/><text class="fill-current font-sans text-[12px] fill-pass" x="645" y="194" text-anchor="middle">Databricks</text><path class="fill-none stroke-pass stroke-[1.5]" d="M645 200 V252"/><circle class="fill-pass" cx="645" cy="258" r="4"/><path class="fill-none stroke-accent stroke-[1.5] [stroke-dasharray:5_4]" d="M645 96 V182" marker-end="url(#ax-6)"/><text class="fill-current font-mono text-[10px] tracking-[.12em] uppercase fill-fail" x="135" y="286" text-anchor="middle">Below 0.20: refused</text><text class="fill-current font-mono text-[10px] tracking-[.12em] uppercase fill-pass" x="435" y="286" text-anchor="middle">0.20 or above: accepted</text><text class="fill-current font-sans text-[11px] fill-muted" x="360" y="312" text-anchor="middle">An unrelated control text scores 0.12, so the line was drawn just above it, at 0.20.</text><text class="fill-current font-sans text-[11px] fill-muted" x="360" y="328" text-anchor="middle">0.49 is well past the line, so Databricks goes on the CV.</text></svg></figure>',
  };

  /* Blocks that want the page's full width and must never be put in a column. */
  var WIDE = ['pre', 'formula', 'table', 'split', 'cover', 'agenda', 'diagram'];
  function isWide(b) {
    return WIDE.some(function (k) { return k in b; });
  }

  /** One data block → one piece of the slide. Unknown keys render nothing. */
  function block(b) {
    if (b.h1) return '<h1 class="' + C.h1 + '">' + inline(b.h1) + '</h1>';
    if (b.h2) return '<h2 class="' + C.h2 + '">' + inline(b.h2) + '</h2>';
    if (b.h3) return '<h3 class="' + C.h3 + '">' + inline(b.h3) + '</h3>';
    if (b.sub) return '<p class="' + C.sub + '">' + inline(b.sub) + '</p>';
    if (b.lede) return '<p class="' + C.lede + '">' + inline(b.lede) + '</p>';
    if (b.small) return '<p class="' + C.note + '">' + inline(b.small) + '</p>';
    if (b.p) return '<p class="' + C.p + '">' + inline(b.p) + '</p>';
    if (b.callout) return '<p class="' + C.callout + '">' + inline(b.callout) + '</p>';
    if (b.diagram) return DIAGRAMS[b.diagram] || '';

    // Diagrams and formulas are never marked up — asterisks and backticks are
    // content there, not syntax.
    if (b.pre) return '<pre class="' + C.pre + '">' + esc(b.pre) + '</pre>';
    if (b.formula) return '<pre class="' + C.formula + '">' + esc(b.formula) + '</pre>';

    if (b.list) {
      var tag = b.ordered ? 'ol' : 'ul';
      return '<' + tag + ' class="' + C.list + ' ' + (b.ordered ? 'list-decimal' : 'list-disc') + '">' +
        b.list.map(function (li) { return '<li>' + inline(li) + '</li>'; }).join('') +
        '</' + tag + '>';
    }
    if (b.credits) {
      return '<div class="flex flex-wrap gap-y-[.4em] gap-x-8 font-mono text-cap tracking-[.03em] text-muted">' +
        b.credits.map(function (c) { return '<span>' + inline(c) + '</span>'; }).join('') + '</div>';
    }
    if (b.agenda) {
      return '<ol class="' + C.agenda + '">' + b.agenda.map(function (r) {
        var subs = (r[2] && r[2].length)
          ? '<span class="flex flex-wrap gap-y-[.15em] gap-x-[1.15em] font-serif font-normal ' +
              'tracking-normal text-[.56em] leading-[1.4] text-muted">' +
            r[2].map(function (t, j) {
              return '<span class="inline-flex items-baseline gap-[.4em]">' +
                '<i class="not-italic font-mono text-[.82em] tracking-[.04em] uppercase ' +
                'text-accent min-w-[2.1em] text-right">' + roman(j + 1) + '</i>' +
                inline(t) + '</span>';
            }).join('') + '</span>'
          : '';
        return '<li class="' + C.agendaLi + '">' +
          '<i class="not-italic font-mono font-normal text-[.62em] tracking-[.08em] text-accent">' +
          esc(r[0]) + '</i><div class="flex flex-col gap-[.2em]">' + inline(r[1]) + subs + '</div></li>';
      }).join('') + '</ol>';
    }
    if (b.rows) {
      return '<div class="' + C.rows + '">' + b.rows.map(function (r) {
        return '<div class="' + C.row + '"><b class="font-sans font-semibold">' +
          inline(r[0]) + '</b><span>' + inline(r[1]) + '</span></div>';
      }).join('') + '</div>';
    }
    if (b.beat) {
      return '<dl class="' + C.beat + '">' + b.beat.map(function (r) {
        return '<dt class="' + C.dt + '">' + inline(r[0]) + '</dt>' +
          '<dd class="' + C.dd + ' m-0">' + inline(r[1]) + '</dd>';
      }).join('') + '</dl>';
    }
    if (b.table) {
      var head = b.table.head
        ? '<tr>' + b.table.head.map(function (h) {
            return '<th class="' + C.th + ' last:pr-0">' + inline(h) + '</th>';
          }).join('') + '</tr>'
        : '';
      var rows = (b.table.rows || []).map(function (row) {
        return '<tr>' + row.map(function (c) {
          return '<td class="' + C.td + ' last:pr-0">' + inline(c) + '</td>';
        }).join('') + '</tr>';
      }).join('');
      return '<div class="overflow-x-auto"><table class="' + C.table + '">' + head + rows + '</table></div>';
    }
    if (b.split) {
      return '<div class="' + C.split + '">' + b.split.map(function (col) {
        return '<div class="' + C.stack + '">' + col.map(block).join('') + '</div>';
      }).join('') + '</div>';
    }

    if (b.cover) {
      var c = b.cover, inst = c.institution || {};
      var line = function (cls, v) { return v ? '<span class="' + cls + '">' + inline(v) + '</span>' : ''; };

      var logos = (c.logos && c.logos.length)
        ? '<div class="' + C.coverLogos + '">' + c.logos.map(function (l) {
            if (!l.src) return '<span class="' + C.logoSlot + '" data-slot="' + esc(l.alt || 'logo') + '">' + inline(l.alt || 'logo') + '</span>';
            var img = '<img src="' + esc(l.src) + '" alt="' + esc(l.alt || '') +
              '" class="' + C.logoImg + (l.invertOnDark ? ' invert-dark' : '') + '"' +
              ' data-slot="' + esc(l.alt || 'logo') + '">';
            return l.plate ? '<span class="' + C.logoPlate + '">' + img + '</span>' : img;
          }).join('') + '</div>'
        : '';

      var top = '<header class="' + C.coverTop + '"><div class="' + C.coverInst + '">' +
        line(C.uni, inst.university) + line(C.school, inst.school) +
        line(C.dept, inst.department) + '</div>' + logos + '</header>';

      var degree = (c.degreeIntro || c.degree || c.degreeField)
        ? '<div class="' + C.degree + '">' +
            (c.degreeIntro ? '<span>' + inline(c.degreeIntro) + '</span>' : '') +
            (c.degree ? '<b>' + inline(c.degree) + '</b>' : '') +
            (c.degreeField ? '<span>' + inline(c.degreeField) + '</span>' : '') + '</div>'
        : '';
      var mid = '<div class="' + C.coverMid + '">' + line(C.country, inst.country) +
        (c.kind ? '<div class="' + C.kind + '">' + inline(c.kind) + '</div>' : '') + degree +
        (c.title ? '<div class="' + C.coverTitle + '">' + inline(c.title) + '</div>' : '') +
        (c.year ? '<div class="' + C.year + '">' + inline(c.year) + '</div>' : '') + '</div>';

      var jury = (c.jury && c.jury.length)
        ? '<div class="' + C.jury + '">' +
            (c.defenseLead ? '<p class="' + C.coverLbl + ' mb-[clamp(.5rem,1.5vh,1rem)]">' + inline(c.defenseLead) + '</p>' : '') +
            '<ul>' + c.jury.map(function (j) {
              return '<li><b>' + inline(j[0]) + '</b><span>' + inline(j[1] || '') + '</span></li>';
            }).join('') + '</ul></div>'
        : '<div></div>';
      var people = [c.author, c.host].filter(Boolean).map(function (person) {
        return '<div><span class="' + C.coverLbl + '">' + inline(person.label || '') + '</span><b>' +
          inline(person.name || '') + '</b></div>';
      }).join('');
      var bottom = '<footer class="' + C.coverBottom + '">' + jury +
        '<div class="' + C.people + '">' + people + '</div></footer>';

      return '<div class="' + C.cover + '">' + top + mid + bottom + '</div>';
    }
    return '';
  }

  function slide(s) {
    var blocks = (s.blocks || []).slice();
    var head = '';
    if (s.eyebrow && s.eyebrow.length) {
      head += '<div class="' + C.eyebrow + '"><b class="font-bold">' + esc(s.eyebrow[0]) + '</b>' +
        (s.eyebrow[1] ? '<span class="text-muted tracking-[.1em]">' + esc(s.eyebrow[1]) + '</span>' : '') +
        '</div>';
    }
    // The opening heading belongs to the header band, not to the flowing body.
    if (blocks.length && (blocks[0].h1 || blocks[0].h2)) head += block(blocks.shift());
    if (head) head = '<div class="' + C.head + '">' + head + '</div>';

    /*
     * Group what is left: wide blocks stand alone, and each run of two or more
     * prose blocks flows into two columns so the body fills the page.
     */
    var body = '', run = [];
    function flush() {
      if (!run.length) return;
      body += run.length > 1
        ? '<div class="' + C.cols + '">' + run.map(function (h) {
            return '<div class="' + C.colItem + '">' + h + '</div>'; }).join('') + '</div>'
        : '<div class="' + C.measured + '">' + run[0] + '</div>';
      run = [];
    }
    blocks.forEach(function (b) {
      if (isWide(b)) { flush(); body += block(b); }
      else { run.push(block(b)); }
    });
    flush();

    var el = document.createElement('section');
    el.className = C.slide + (s.center ? ' items-center text-center' : '');
    el.dataset.part = s.part || '';
    el.dataset.title = s.title || '';
    el.innerHTML = '<div class="w-full flex ' + (s.center ? 'justify-center' : 'justify-start') + '">' +
      '<div class="fit ' + C.fit + '">' + head +
      '<div class="' + C.body + '">' + body + '</div></div></div>';
    return el;
  }

  var deck = document.getElementById('deck');

  /*
   * Shrinks a slide that would otherwise run past the fold, so no slide ever
   * scrolls. Only the ones that need it are touched — the rest keep the full
   * type size. A hidden slide measures as zero, so this runs on the active one.
   */
  function fitSlide(el) {
    if (!el) return;
    var box = el.firstElementChild;
    var inner = box && box.firstElementChild;
    if (!inner) return;

    box.style.height = '';
    inner.style.transform = '';

    var natural = inner.getBoundingClientRect().height;
    if (!natural) return;
    var cs = getComputedStyle(el);
    var room = el.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    if (room <= 0) return;

    var scale = Math.min(1, room / natural);
    if (scale >= 0.999) return;
    inner.style.transform = 'scale(' + scale + ')';
    // The transform is visual only, so the box still has to claim the height
    // the scaled content actually occupies or the slide stays off-centre.
    box.style.height = natural * scale + 'px';
  }

  function fail(message) {
    deck.innerHTML =
      '<div class="px-gutter py-[clamp(2rem,6vw,5rem)] max-w-[70ch] flex flex-col gap-3">' +
      '<h2 class="' + C.h2 + '">Slides could not load</h2>' +
      '<p class="' + C.lede + '">' + esc(message) + '</p>' +
      '<p class="' + C.note + '">This page reads <code class="font-mono">slides.json</code> over HTTP, ' +
      'which a <code class="font-mono">file://</code> tab cannot do. Run ' +
      '<code class="font-mono">pnpm dev</code> and open ' +
      '<code class="font-mono">http://localhost:3000/presentation/</code>.</p></div>';
  }

  fetch('slides.json', { cache: 'no-store' })
    .then(function (r) {
      if (!r.ok) throw new Error('slides.json returned ' + r.status);
      return r.json();
    })
    .then(function (data) { start(data); })
    .catch(function (e) { fail(e.message); });

  function start(file) {
    var data = file.slides || [];
    var meta = file.meta || {};
    if (!data.length) return fail('slides.json contains no slides.');

    // The app mark rides above the stage rather than inside a slide, so it sits
    // in the same corner on every one of them without being repeated in data.
    if (meta.mark && meta.mark.src) {
      var markEl = document.createElement('div');
      markEl.className = 'fixed z-10 pointer-events-none right-gutter top-[clamp(.85rem,2.6vh,1.7rem)]';
      markEl.innerHTML = '<img src="' + esc(meta.mark.src) + '" alt="' +
        esc(meta.mark.alt || '') + '" class="block w-auto opacity-90 ' +
        'h-[clamp(24px,3.4vh,36px)]' + (meta.mark.invertOnDark ? ' invert-dark' : '') + '">';
      markEl.querySelector('img').addEventListener('error', function () { markEl.remove(); });
      document.body.appendChild(markEl);
    }

    deck.innerHTML = '';
    var slides = data.map(function (s) {
      var el = slide(s);
      deck.appendChild(el);
      return el;
    });

    var hud = document.getElementById('hud');
    var cur = document.getElementById('cur');
    var bar = document.getElementById('bar');
    var part = document.getElementById('part');
    var panel = document.getElementById('panel');
    var list = document.getElementById('list');
    hud.hidden = false;
    document.getElementById('tot').textContent = slides.length;
    var at = 0;

    function show(n) {
      at = Math.max(0, Math.min(slides.length - 1, n));
      slides.forEach(function (s, i) {
        s.classList.toggle('hidden', i !== at);
        s.classList.toggle('flex', i === at);
        s.classList.toggle('animate-rise', i === at);
      });
      cur.textContent = at + 1;
      bar.style.width = ((at + 1) / slides.length * 100) + '%';
      part.textContent = slides[at].dataset.part || '';
      fitSlide(slides[at]);
      window.scrollTo(0, 0);
      try { location.hash = at ? 's' + (at + 1) : ''; } catch (e) { /* sandboxed */ }
    }

    slides.forEach(function (s, i) {
      var li = document.createElement('li');
      li.className = 'break-inside-avoid';
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'w-full text-left cursor-pointer grid grid-cols-[2.4em_1fr] gap-[.8em] ' +
        'items-baseline py-[.42em] border-b border-rule font-sans font-medium ' +
        'tracking-[-.01em] text-[clamp(.85rem,1.35vw,1rem)] text-ink hover:text-accent';
      b.innerHTML = '<i class="not-italic font-mono text-[.78em] text-muted">' +
        String(i + 1).padStart(2, '0') + '</i>';
      b.appendChild(document.createTextNode(s.dataset.title || ''));
      b.addEventListener('click', function () { panel.hidden = true; show(i); });
      li.appendChild(b);
      list.appendChild(li);
    });

    document.getElementById('idx').addEventListener('click', function () {
      panel.hidden = !panel.hidden;
    });

    /*
     * Full screen is offered only where the browser actually allows it — inside
     * a sandboxed frame the request is refused, and a button that does nothing
     * is worse than no button.
     */
    var full = document.getElementById('full');
    function toggleFullscreen() {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen().catch(function () { full.hidden = true; });
    }
    if (document.fullscreenEnabled) {
      full.hidden = false;
      full.addEventListener('click', toggleFullscreen);
      document.addEventListener('fullscreenchange', function () {
        full.textContent = document.fullscreenElement ? 'Exit full screen' : 'Full screen';
        fitSlide(slides[at]);
      });
    }

    document.addEventListener('keydown', function (e) {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      var k = e.key;
      if (k === 'Escape' || k === 'o' || k === 'O') {
        panel.hidden = !panel.hidden; e.preventDefault(); return;
      }
      if (k === 'f' || k === 'F') {
        if (document.fullscreenEnabled) toggleFullscreen();
        e.preventDefault(); return;
      }
      if (!panel.hidden) return;
      if (k === 'ArrowRight' || k === 'PageDown' || k === ' ' || k === 'Enter') { show(at + 1); e.preventDefault(); }
      else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { show(at - 1); e.preventDefault(); }
      else if (k === 'Home') { show(0); e.preventDefault(); }
      else if (k === 'End') { show(slides.length - 1); e.preventDefault(); }
    });

    // A logo whose file is not in place yet falls back to the dashed slot,
    // so the cover never shows a broken-image icon while assets are missing.
    deck.querySelectorAll('img[data-slot]').forEach(function (img) {
      img.addEventListener('error', function () {
        var slot = document.createElement('span');
        slot.className = C.logoSlot;
        slot.textContent = img.dataset.slot || 'logo';
        img.replaceWith(slot);
      });
    });

    var m = /^#s(\d+)$/.exec(location.hash);
    show(m ? parseInt(m[1], 10) - 1 : 0);

    /*
     * Every measurement below can only be trusted once the styles that drive it
     * exist. Web fonts land after first paint, and Tailwind's browser build
     * generates its stylesheet from the DOM we just built — so re-fit on both,
     * and once more on load as the backstop.
     */
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(function () { fitSlide(slides[at]); });
    }
    new MutationObserver(function () { fitSlide(slides[at]); })
      .observe(document.head, { childList: true, subtree: true });
    window.addEventListener('load', function () { fitSlide(slides[at]); });

    var resizeTimer;
    window.addEventListener('resize', function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function () { fitSlide(slides[at]); }, 120);
    });
  }
})();
</script>
</body></html>
